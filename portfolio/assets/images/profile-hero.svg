<svg width="420" height="500" viewBox="0 0 420 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="420" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8EDFF"/>
      <stop offset="100%" stop-color="#D5DBFF"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="210" y1="80" x2="210" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDDCB5"/>
      <stop offset="100%" stop-color="#F0C090"/>
    </linearGradient>
    <linearGradient id="blazerGrad" x1="210" y1="230" x2="210" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5C6BC0"/>
      <stop offset="100%" stop-color="#3949AB"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="210" y1="250" x2="210" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect width="420" height="500" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="420" height="500" fill="url(#bgGrad)"/>

  <!-- Body / Blazer -->
  <ellipse cx="210" cy="520" rx="170" ry="200" fill="url(#blazerGrad)"/>

  <!-- Shirt collar / V-neck -->
  <path d="M170 310 L210 370 L250 310 Z" fill="url(#shirtGrad)" opacity="0.9"/>
  <path d="M175 310 L210 360 L245 310" stroke="#BDBDBD" stroke-width="1" fill="none"/>

  <!-- Neck -->
  <rect x="192" y="225" width="36" height="50" rx="18" fill="url(#skinGrad)"/>

  <!-- Head -->
  <ellipse cx="210" cy="170" rx="72" ry="82" fill="url(#skinGrad)"/>

  <!-- Hair -->
  <ellipse cx="210" cy="110" rx="78" ry="55" fill="#3E2723"/>
  <path d="M132 140 Q140 90 210 80 Q280 90 288 140 Q280 110 210 105 Q140 110 132 140Z" fill="#2C1B0E"/>

  <!-- Eyes -->
  <ellipse cx="185" cy="175" rx="8" ry="5" fill="#1A1A2E"/>
  <ellipse cx="235" cy="175" rx="8" ry="5" fill="#1A1A2E"/>
  <circle cx="183" cy="173" r="2" fill="white" opacity="0.8"/>
  <circle cx="233" cy="173" r="2" fill="white" opacity="0.8"/>

  <!-- Eyebrows -->
  <path d="M172 162 Q185 155 198 162" stroke="#2C1B0E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M222 162 Q235 155 248 162" stroke="#2C1B0E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M207 185 Q210 195 213 185" stroke="#D4A76A" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Mouth / Smile -->
  <path d="M193 205 Q210 218 227 205" stroke="#C77D5A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="138" cy="175" rx="10" ry="15" fill="url(#skinGrad)"/>
  <ellipse cx="282" cy="175" rx="10" ry="15" fill="url(#skinGrad)"/>

  <!-- Blazer lapels -->
  <path d="M155 310 L185 350 L175 380 L130 340 Z" fill="#4A5AB8" opacity="0.7"/>
  <path d="M265 310 L235 350 L245 380 L290 340 Z" fill="#4A5AB8" opacity="0.7"/>

  <!-- Blazer buttons -->
  <circle cx="210" cy="380" r="4" fill="#3949AB"/>
  <circle cx="210" cy="410" r="4" fill="#3949AB"/>

  <!-- Small label: Replace photo -->
  <rect x="110" y="470" width="200" height="24" rx="12" fill="rgba(0,0,0,0.15)"/>
  <text x="210" y="486" text-anchor="middle" fill="white" font-family="Poppins, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Replace with your photo</text>
</svg>
